<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hotel Classic Hills</title>
    <script>
      // Update pathSegmentsToKeep to the number of path segments that make
      // up your GitHub Pages project base:
      // - 1 for a project site served at /<repo-name>/
      // - 0 for a user/org site or a custom domain served at the domain root.
      var pathSegmentsToKeep = 0

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
